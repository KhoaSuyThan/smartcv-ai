name: Deploy to AWS EC2

on:
  # Kích hoạt THỦ CÔNG từ tab Actions trên GitHub
  # Chỉ deploy khi bạn chủ động nhấn "Run workflow", không tự động chạy khi push
  workflow_dispatch:

  # --- GHI CHÚ: Bỏ comment 3 dòng dưới nếu muốn bật lại auto-deploy khi push vào main ---
  # push:
  #   branches:
  #     - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Executing remote ssh commands using password
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd DoAnWeb
            git pull
            
            cat << 'EOF' > appsettings.Production.json
            ${{ secrets.APPSETTINGS_PRODUCTION_JSON }}
            EOF
            chmod 400 appsettings.Production.json
            
            sudo docker-compose down
            sudo docker system prune -af
            sudo docker-compose up --build -d
